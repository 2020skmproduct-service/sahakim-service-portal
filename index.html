        const GAS_CODE_TEMPLATE = "// ============================================================================\n// SAHA KIM MOTOR V12.1 - GOOGLE SHEETS & APPSHEET BACKEND (Code.gs)\n// วิธีใช้งาน:\n// 1. สร้างไฟล์ Google Sheet ใหม่ -> ไปที่เมนู ส่วนขยาย (Extensions) > Apps Script\n// 2. ลบโค้ดเดิมออกทั้งหมด แล้ววางโค้ดนี้ลงไป กดบันทึก (ไอคอนแผ่นดิสก์)\n// 3. กดปุ่ม \"ทำให้ใช้งานได้\" (Deploy) > \"การทำให้ใช้งานได้รายการใหม่\" (New deployment)\n// 4. เลือกประเภทเป็น \"เว็บแอป\" (Web app)\n//    - ดำเนินการในฐานะ (Execute as): \"ฉัน\" (Me)\n//    - ผู้ที่มีสิทธิ์เข้าถึง (Who has access): \"ทุกคน\" (Anyone)\n// 5. กด Deploy แล้วคัดลอก Web App URL (ลงท้ายด้วย /exec) มาวางในหน้าเว็บ Saha Kim Motor\n// ============================================================================\n\nconst SHEET_TICKETS = 'Tickets';\n\nfunction setupSheets() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sheet = ss.getSheetByName(SHEET_TICKETS);\n  if (!sheet) {\n    sheet = ss.insertSheet(SHEET_TICKETS);\n    sheet.appendRow([\n      'TicketID',\n      'Company',\n      'TaxID',\n      'DocNo',\n      'Contact',\n      'SiteContact',\n      'Location',\n      'Warranty',\n      'ServiceType',\n      'Urgency',\n      'DesiredDate',\n      'ConfirmedDate',\n      'Status',\n      'AssignedTech',\n      'ApprovedBySupervisor',\n      'EquipmentSummary',\n      'CreatedAt',\n      'RawJson'\n    ]);\n    sheet.getRange(1, 1, 1, 18).setFontWeight('bold').setBackground('#0f172a').setFontColor('#ffffff');\n  }\n  return sheet;\n}\n\nfunction doGet(e) {\n  const sheet = setupSheets();\n  const rows = sheet.getDataRange().getValues();\n  const tickets = [];\n  for (let i = 1; i < rows.length; i++) {\n    const rawJson = rows[i][17];\n    if (rawJson) {\n      try {\n        tickets.push(JSON.parse(rawJson));\n      } catch (err) {}\n    }\n  }\n  return ContentService\n    .createTextOutput(JSON.stringify({ status: 'ok', tickets: tickets }))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doPost(e) {\n  try {\n    const sheet = setupSheets();\n    const payload = JSON.parse(e.postData.contents);\n    const tickets = payload.tickets || [];\n\n    if (sheet.getLastRow() > 1) {\n      sheet.getRange(2, 1, sheet.getLastRow() - 1, 18).clearContent();\n    }\n\n    const rowsToWrite = tickets.map(function(t) {\n      const eqSummary = (t.equipmentList || []).map(function(eq) {\n        return eq.type + ' (' + eq.brand + ' ' + (eq.model || '') + '): ' + eq.symptom;\n      }).join(' | ');\n\n      return [\n        t.id || '',\n        t.company || '',\n        t.taxId || '',\n        t.docNo || '',\n        t.contact || '',\n        t.siteContact || '',\n        t.location || '',\n        t.warranty || '',\n        t.serviceType || '',\n        t.urgency || '',\n        t.desiredDate || '',\n        t.confirmedDate || '',\n        t.status || '',\n        t.assignedTech || '',\n        t.approvedBySupervisor || '',\n        eqSummary,\n        t.createdAt || '',\n        JSON.stringify(t)\n      ];\n    });\n\n    if (rowsToWrite.length > 0) {\n      sheet.getRange(2, 1, rowsToWrite.length, 18).setValues(rowsToWrite);\n    }\n\n    return ContentService\n      .createTextOutput(JSON.stringify({ status: 'ok', count: rowsToWrite.length }))\n      .setMimeType(ContentService.MimeType.JSON);\n  } catch (err) {\n    return ContentService\n      .createTextOutput(JSON.stringify({ status: 'error', message: err.toString() }))\n      .setMimeType(ContentService.MimeType.JSON);\n  }\n}";
        let gasWebAppUrl = localStorage.getItem('sahakim_gas_url') || "";

        function getChecklistForType(type) {

        let knowledgeTemplates = JSON.parse(localStorage.getItem('sahakim_knowledge_templates') || JSON.stringify([{"id":"TPL-EASA-01","title":"มอเตอร์ขดลวดไหม้ / ค่าฉนวนต่ำ (EASA AR100 & IEEE 43)","category":"MOTOR","sourceRef":"EASA AR100 / IEEE Std 43 / BULL POWER & BROOK CROMPTON Manual","analysis":"วัดค่าความต้านทานฉนวน (Insulation Resistance) ด้วย Megger 500VDC ได้ต่ำกว่าเกณฑ์มาตรฐาน IEEE 43 (< 100 MΩ) และพบกลิ่นไหม้ที่ขดลวดสเตเตอร์เนื่องจากความร้อนสะสมเกินพิกัด (Thermal Overload Class F/H)","cause":"แรงดันไฟฟ้าไม่สมดุล (Voltage Unbalance > 1%) หรือเกิดภาวะ Single Phasing / ทำงานเกินพิกัดกระแสต่อเนื่อง (Overload) ร่วมกับการระบายความร้อนไม่เพียงพอ","correctiveAction":"พันขดลวดสเตเตอร์ใหม่ด้วยลวดทองแดงเคลือบน้ำยา Class H อาบวานิชอบแห้งตามมาตรฐาน EASA AR100 เปลี่ยนตลับลูกปืนทั้งด้าน DE/NDE และทดสอบเดินตัวเปล่า (No-Load Test) วัดกระแสทั้ง 3 เฟสให้สมดุล","recommendedChecklist":["Measure 3-Phase Supply Voltage Unbalance (< 1% per NEMA MG1)","Polarization Index (PI) & Megger Insulation Test at 500/1000 VDC"]},{"id":"TPL-PUMP-01","title":"ปั๊มเกิดโพรงอากาศ / เสียงดังคล้ายกรวดและแรงดันตก (Cavitation)","category":"PUMP","sourceRef":"Karassik's Pump Handbook (4th Ed.) / Hydraulic Institute / STAC & UNOMACH Guide","analysis":"เกิดเสียงดังรัวคล้ายเม็ดกรวดกระทบภายในเรือนปั๊ม (Volute Casing) ร่วมกับค่าความสั่นสะเทือนสูงผิดปกติ และเข็มเกจวัดแรงดันด้านส่ง (Discharge Pressure) สั่นแกว่งเนื่องจากเกิดภาวะโพรงอากาศ (Suction Cavitation: NPSHa < NPSHr)","cause":"ท่อทางดูด (Suction Line) หรือ Strainer อุดตันทำให้เกิด Pressure Drop สูง หรือระดับน้ำฝั่งดูดต่ำกว่าค่าออกแบบ (Insufficient Submergence / High Suction Lift)","correctiveAction":"ถอดล้างทำความสะอาด Y-Strainer และตรวจสอบวาล์วทางดูด ตรวจสอบรอยรั่วอากาศฝั่งท่อดูด (Suction Air Ingress) ตรวจสอบสภาพใบพัด (Impeller) หากสึกกร่อนมากให้เปลี่ยนใบพัดและ Wear Ring ใหม่พร้อมทำ Dynamic Balancing ตามมาตรฐาน ISO 1940 G6.3","recommendedChecklist":["Suction Compound Gauge Vacuum Reading & Strainer Differential Check","Impeller Vane Pitting & Wear Ring Radial Clearance Measurement"]},{"id":"TPL-PUMP-02","title":"ซีลกันรั่วซึม / ตลับลูกปืนร้อนและสั่นสะเทือนสูง (Misalignment & Seal Failure)","category":"PUMP","sourceRef":"Karassik's Pump Handbook / VARISCO & FYBROC Maintenance Manual / ISO 10816","analysis":"พบการรั่วซึมของของเหลวออกทางชุด Mechanical Seal อย่างต่อเนื่อง และอุณหภูมิเสื้อลูกปืน (Bearing Housing) สูงเกิน 85°C ร่วมกับค่า Vibration เกินเกณฑ์มาตรฐาน ISO 10816","cause":"เกิดจากการเยื้องศูนย์ของเพลาปั๊มและมอเตอร์ (Angular / Parallel Shaft Misalignment) หรือเกิดภาวะเดินปั๊มตัวเปล่าโดยไม่มีน้ำหล่อเลี้ยงซีล (Dry Running / Thermal Shock)","correctiveAction":"ถอดเปลี่ยนชุด Mechanical Seal (SiC/SiC/Viton) และตลับลูกปืนใหม่ ตรวจสอบค่าความคดของเพลา (Shaft Runout TIR ≤ 0.05 mm) และทำ Laser Shaft Alignment หน้างานให้ได้ค่าความคลาดเคลื่อนไม่เกิน ±0.05 mm พร้อมตรวจสอบความเครียดท่อ (Pipe Strain)","recommendedChecklist":["Shaft Runout (TIR) & Coupling Angular/Parallel Alignment Check","Pipe Strain Check on Suction & Discharge Flanges"]},{"id":"TPL-SEWAGE-01","title":"ปั๊มจุ่มน้ำเสียตัด Overload / ใบพัดติดขัดและน้ำเข้าห้องน้ำมัน","category":"SEWAGE","sourceRef":"Submersible Sewage Pump Handbook / UNOMACH & VARISCO Troubleshooting Guide","analysis":"เบรกเกอร์และ Overload Relay ทริปทันทีเมื่อสั่งสตาร์ท ตรวจพบเศษขยะพันติดใบพัด (Impeller Jamming) และพบน้ำปนเปื้อนในห้องน้ำมันซีล (Oil Chamber Emulsified) ทำให้ซีลตัวล่างสึกหรอ","cause":"ขยะเส้นใยยาวหรือของแข็งเกินขนาดผ่านเข้าใบพัดทำให้เพลาล็อก (Locked Rotor Current สูง 6-7 เท่า) และทำลายผิวหน้าสัมผัส Mechanical Seal","correctiveAction":"ถอดล้างสิ่งอุดตันในเรือนปั๊มและใบพัด เปลี่ยนชุด Double Mechanical Seal และถ่ายเปลี่ยนน้ำมันหล่อลื่น Food Grade / Turbine Oil VG32 ในห้องซีล อบไล่ความชื้นขดลวดและอัดอีพ็อกซี่ที่ขั้วสายไฟ (Cable Entry) ใหม่","recommendedChecklist":["Oil Chamber Dielectric & Moisture Inspection","Submersible Cable Insulation & Float Switch Level Check"]},{"id":"TPL-CTRL-01","title":"ตู้คอนโทรลทริป / Magnetic Contactor หน้าสัมผัสไหม้ / VFD Fault","category":"CONTROL","sourceRef":"IEC 60947-4-1 / EASA Electrical Testing & Control Panel Troubleshooting","analysis":"ตรวจพบรอยอาร์คและหน้าสัมผัส (Contact Tips) ของ Magnetic Contactor สึกหรอไม่เท่ากัน ส่งผลให้แรงดันไฟฟ้าตกคร่อมเฟสและทำให้ Thermal Overload หรือ VFD แจ้งเตือน Overcurrent / Phase Loss","cause":"เกิดจากการสตาร์ท-หยุดบ่อยครั้ง (Frequent Jogging/Starting) หรือขั้วต่อสายไฟหลวมทำให้เกิดความร้อนสูงที่จุดต่อ (Loose Terminal Hot Spot)","correctiveAction":"เปลี่ยนชุด Magnetic Contactor และ Overload Relay ให้ตรงตามพิกัดกระแส (AC-3 Duty) ขันกวดขั้วต่อสายกำลังทั้งหมดตามค่า Torque มาตรฐาน ตั้งค่าพารามิเตอร์ Ramp-up/Ramp-down และ Current Limit ใน VFD/Soft Starter ใหม่","recommendedChecklist":["Contactor Contact Voltage Drop & Phase Balance Test","Overload Relay Trip Current Setting vs Motor Nameplate FLA"]}]));
        let savedSupPassword = localStorage.getItem('sahakim_sup_pass') || "admin123";
        let savedTechs = localStorage.getItem('sahakim_technicians');
        let initialTechs = savedTechs ? JSON.parse(savedTechs) : [{"id":"TECH-01","name":"ช่างวิชัย มือทอง","specialization":"PUMP & MOTOR EXPERT (EASA / HYDRAULIC)","status":"Available","pin":"1111"},{"id":"TECH-02","name":"ช่างสมชาย ช่างกล","specialization":"BLOWER, AERATOR & CONTROL EXPERT","status":"On Duty","pin":"2222"},{"id":"TECH-03","name":"ช่างประเสริฐ ซ่อมไว","specialization":"FIRE PUMP, SEWAGE & GEN SET EXPERT","status":"Available","pin":"3333"}];

        function playAlertSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

            });
            let targetEl = document.getElementById(`cust-tab-${tab}`);

        function submitNewTicket(event) {
            event.preventDefault();
            let contactVal = document.getElementById('new-contact').value;
            let docNoVal = document.getElementById('new-docno').value;
            let serviceTypeVal = document.getElementById('new-servicetype').value;
            let warrantyVal = document.getElementById('new-warranty').value;
            let urgencyVal = document.getElementById('new-urgency').value;
            let locationVal = document.getElementById('new-location').value;
            let fileInput = document.getElementById('new-image-file');
            let imgUrl = "";
            if (fileInput.files && fileInput.files[0]) {
                imgUrl = URL.createObjectURL(fileInput.files[0]);
            }

            const resolvedEquip = tempEquipmentList.map(eq => {
                let finalType = eq.type.startsWith('ETC.') && eq.customType.trim() ? eq.customType.trim().toUpperCase() : eq.type;
                let finalBrand = eq.brand.startsWith('ETC.') && eq.customBrand.trim() ? eq.customBrand.trim().toUpperCase() : eq.brand;
                if (eq.type.startsWith('ETC.') && eq.customType.trim()) customEquipList.push(finalType);
                if (eq.brand.startsWith('ETC.') && eq.customBrand.trim()) customBrandList.push(finalBrand);
                return {
                    type: finalType,
                    brand: finalBrand,
                    model: eq.model || '-',
                    tag: eq.tag || 'N/A',
                    symptom: eq.symptom,
                    detail: '',
                    beforePhotos: imgUrl ? [imgUrl] : [],
                    afterPhotos: [],
                    analysis: "",
                    cause: "",
                    standardsReference: "",
                    faultOrigin: warrantyVal.includes('In-Warranty') ? 'เกิดจากผลิตภัณฑ์ / อยู่ในประกัน (ฟรี / FOC)' : 'เกิดจากการใช้งาน / หมดรับประกัน (คิดค่าบริการ)',
                    correctiveAction: "",
                    parts: [],
                    partsApproved: false,
                    checklistResults: getChecklistForType(finalType).map(item => ({ item, beforeStatus: 'NG', afterStatus: 'OK' }))
                };
            });

            const newTicket = {
                id: `SKM-69-${String(state.tickets.length + 1).padStart(3, '0')}`,
                company: document.getElementById('new-company').value,
                taxId: document.getElementById('new-taxid').value,
                docNo: docNoVal,
                contact: contactVal,
                siteContact: contactVal,
                location: locationVal,
                warranty: warrantyVal,
                serviceType: serviceTypeVal,
                urgency: urgencyVal,
                desiredDate: document.getElementById('new-date').value,
                confirmedDate: '',
                status: "NEW",
                isLocked: false,
                rejectReason: "",
                createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                equipmentList: resolvedEquip,
                assignedTech: "",
                approvedBySupervisor: ""
            };
            state.tickets.unshift(newTicket);
            persistState();
            tempEquipmentList = [];
            alert('สร้างใบแจ้งซ่อมสำเร็จ!');
            switchCustTab('list');
            render();
        }

            let closedTickets = state.tickets.filter(t => t.status === 'CLOSE').length;
            let focCount = state.tickets.filter(t => t.warranty && t.warranty.includes('In-Warranty')).length;
            let chargeCount = totalTickets - focCount;
            let totalMoney = 0;
            let equipCountMap = {};
            state.tickets.forEach(t => {
                t.equipmentList.forEach(eq => {
                    equipCountMap[eq.type] = (equipCountMap[eq.type] || 0) + 1;
                    if (eq.parts) eq.parts.forEach(p => totalMoney += (p.total || 0));
                });
            });
            let onTimeCount = Math.max(1, Math.floor(totalTickets * 0.85));
            let overdueCount = Math.max(0, totalTickets - onTimeCount);
            let topEquip = Object.keys(equipCountMap).sort((a,b) => equipCountMap[b] - equipCountMap[a])[0] || "BOOSTER PUMP";

            return `
                <div class="space-y-4">
                    <div class="bg-slate-900 text-white p-4 sm:p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                            <span class="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase">Internal Staff Portal</span>
                            <h2 class="text-xl sm:text-2xl font-bold mt-1">บทบาทปัจจุบัน: ${state.userRole}</h2>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 text-xs">
                            ${state.userRole === 'SUPERVISOR' ? `
                                <button onclick="openGoogleSheetModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-3 py-1.5 rounded-lg font-bold shadow cursor-pointer"><i class="fa-solid fa-database text-emerald-400 mr-1"></i> <span id="gsheet-status-badge">ตั้งค่าฐานข้อมูล Google Sheet (Admin)</span></button>
                                <button onclick="openTechnicianManager()" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg font-bold shadow cursor-pointer"><i class="fa-solid fa-users-gear mr-1"></i> จัดการพนักงาน (เพิ่ม/ลบ/รหัส)</button>
                            ` : ''}
                            <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold shadow cursor-pointer"><i class="fa-solid fa-file-excel mr-1"></i> Export Excel</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                        <div class="bg-white p-3 rounded-xl shadow border">
                            <p class="text-slate-500 font-bold">งานทั้งหมดต่อเดือน</p>
                            <h3 class="text-xl font-extrabold text-slate-900 mt-1">${totalTickets} งาน (ปิดแล้ว ${closedTickets})</h3>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border">
                            <p class="text-slate-500 font-bold">ประเภทงาน FOC / คิดเงิน</p>
                            <h3 class="text-sm font-bold text-indigo-600 mt-1">FOC: ${focCount} | คิดเงิน: ${chargeCount}</h3>
                            <p class="text-[10px] text-slate-500">ยอดอะไหล่รวม: ${totalMoney.toLocaleString()} THB</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border">
                            <p class="text-slate-500 font-bold">สินค้าที่เสียบ่อยสุด</p>
                            <h3 class="text-sm font-bold text-orange-600 mt-1">${topEquip}</h3>
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow border">
                            <p class="text-slate-500 font-bold">เวลาการทำงาน (SLA)</p>
                            <h3 class="text-sm font-bold text-emerald-600 mt-1">ตรงเวลา: ${onTimeCount} | เกินเวลา: ${overdueCount}</h3>
                        </div>
                    </div>

                    <div class="bg-white p-4 sm:p-6 rounded-2xl shadow border space-y-3">
                        <h3 class="text-base font-bold text-slate-900 border-b pb-2"><i class="fa-solid fa-list-check text-orange-500 mr-2"></i> จัดการรายการคำขอและสถานะ (Workflow)</h3>
                        <div class="space-y-3">
                            ${state.tickets.map(t => `
                                <div class="bg-slate-50 p-3 sm:p-4 rounded-xl border flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                                    <div class="space-y-1 text-xs">
                                        <div class="flex items-center space-x-2 flex-wrap gap-1">
                                            <span class="font-bold text-orange-600">${t.id}</span>
                                            ${getActionableStatusButton(t)}
                                            <span class="text-slate-700 font-bold">${t.company}</span>
                                            ${t.isLocked ? '<span class="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-lock mr-1"></i> ล็อกแล้ว</span>' : '<span class="bg-emerald-100 text-emerald-600 text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-lock-open mr-1"></i> เปิดแก้ไข</span>'}
                                        </div>
                                        <p class="text-slate-500">สถานที่: <span class="text-slate-800 font-bold">${t.location || '-'}</span> | ผู้ติดต่อหน้างาน: <b class="text-indigo-600">${t.siteContact || t.contact}</b> | ช่าง: <span class="font-bold">${t.assignedTech || 'ยังไม่ระบุ'}</span></p>
                                    </div>
                                    <div class="flex flex-wrap items-center gap-2">
                                        ${t.isLocked && state.userRole === 'SUPERVISOR' ? `<button onclick="unlockTicket('${t.id}')" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow cursor-pointer"><i class="fa-solid fa-key mr-1"></i> ปลดล็อก</button>` : ''}
                                        <button onclick="openInternalActionModal('${t.id}')" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow cursor-pointer"><i class="fa-solid fa-pen-to-square mr-1"></i> ปฏิบัติงาน/วิเคราะห์ AI</button>
                                        <button onclick="openServiceReport('${t.id}')" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer"><i class="fa-solid fa-print mr-1"></i> รายงาน</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openTechnicianManager() {
            let techRows = state.technicians.map((tc, idx) => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded border text-xs">
                    <div><b>${tc.name}</b> (${tc.id}) - PIN: <span class="text-indigo-600 font-bold">${tc.pin || '1234'}</span><br><span class="text-slate-500 text-[10px]">${tc.specialization}</span></div>
                    <button onclick="removeTechnician(${idx})" class="bg-red-500 text-white px-2 py-1 rounded font-bold cursor-pointer">ลบ</button>
                </div>
            `).join('');

            let modalBg = document.createElement('div');
            modalBg.id = 'tech-modal';
            modalBg.className = 'fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 overflow-y-auto';
            modalBg.innerHTML = `
                <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-5 space-y-3">
                    <div class="flex justify-between items-center border-b pb-2"><h3 class="font-bold text-base text-slate-900"><i class="fa-solid fa-users-gear mr-2"></i> จัดการข้อมูลพนักงานและรหัส PIN</h3><button onclick="document.getElementById('tech-modal').remove()" class="text-xl font-bold cursor-pointer">&times;</button></div>
                    <div class="space-y-2 max-h-60 overflow-y-auto">${techRows}</div>
                    <div class="border-t pt-3 space-y-2 text-xs">
                        <h4 class="font-bold text-slate-800">เพิ่มพนักงานใหม่</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="new-tech-name" placeholder="ชื่อ-นามสกุลช่าง" class="border rounded p-1.5">
                            <input type="text" id="new-tech-spec" placeholder="ความเชี่ยวชาญ" class="border rounded p-1.5">
                            <input type="password" id="new-tech-pin" placeholder="รหัสผ่าน PIN (เช่น 4 หลัก)" class="border rounded p-1.5">
                        </div>
                        <button onclick="addNewTechnician()" class="w-full bg-orange-500 text-white font-bold py-2 rounded shadow cursor-pointer">บันทึกเพิ่มพนักงาน</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalBg);
        }

        function addNewTechnician() {
            let name = document.getElementById('new-tech-name').value;
            let spec = document.getElementById('new-tech-spec').value || "GENERAL TECH";
            let pin = document.getElementById('new-tech-pin').value || "1234";
            if (!name) { alert('กรุณากรอกชื่อช่าง'); return; }
            state.technicians.push({ id: `TECH-0${state.technicians.length + 1}`, name, specialization: spec, status: "Available", pin });
            persistState();
            document.getElementById('tech-modal').remove();
            openTechnicianManager();
        }

        function removeTechnician(idx) {
            if (confirm('ต้องการลบพนักงานนี้ใช่หรือไม่?')) {
                state.technicians.splice(idx, 1);
                persistState();
                document.getElementById('tech-modal').remove();
                openTechnicianManager();
            }
        }

        function unlockTicket(id) {
            let pass = prompt("กรอกรหัสผ่าน Supervisor เพื่อปลดล็อกใบงาน:");
            if (pass === savedSupPassword) {
                const t = state.tickets.find(x => x.id === id);
                if (t) { t.isLocked = false; persistState(); alert(`ปลดล็อกใบงาน ${id} สำเร็จ!`); render(); }
            } else if (pass !== null) { alert('รหัสผ่านไม่ถูกต้อง!'); }
        }

        function supervisorApproveParts(id) {
            const t = state.tickets.find(x => x.id === id);
            if (t) { t.equipmentList.forEach(eq => eq.partsApproved = true); t.status = "REPAIRING"; persistState(); alert('อนุมัติอะไหล่สำเร็จ!'); render(); }
        }

        function supervisorApproveReport(id) {
            const t = state.tickets.find(x => x.id === id);
            if (t) {
                t.approvedBySupervisor = prompt("กรอกชื่อ Supervisor ลงนามอนุมัติ:", "หัวหน้าวิศวกร") || "หัวหน้าวิศวกร";
                t.status = "CUSTOMER_ACCEPTANCE";
                t.isLocked = true;
                persistState();
                alert('อนุมัติรายงานและล็อกข้อมูลสำเร็จ!');
                render();
            }
        }

        function supervisorReject(id) {
            let reason = prompt("ระบุเหตุผลที่ไม่อนุมัติ:");
            if (!reason) return;
            const t = state.tickets.find(x => x.id === id);
            if (t) { t.rejectReason = reason; t.status = "REJECTED"; persistState(); alert('ส่งกลับแก้ไขแล้ว'); render(); }
        }

        function runAiEngineeringAnalysis(ticketId, eqIdx) {
            saveModalValuesWithoutClosing(ticketId);
            const t = state.tickets.find(x => x.id === ticketId);
            const eq = t.equipmentList[eqIdx];
            const upperType = (eq.type || "").toUpperCase();
            const matched = knowledgeTemplates.find(k => upperType.includes(k.category)) || knowledgeTemplates[0];
            if (matched) {
                eq.analysis = `[อ้างอิง ${matched.sourceRef}] วิเคราะห์ ${eq.type} (${eq.brand} ${eq.model}) อาการ "${eq.symptom}": ${matched.analysis}`;
                eq.cause = matched.cause;
                eq.correctiveAction = matched.correctiveAction;
                eq.standardsReference = matched.sourceRef;
            }
            persistState();
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function applyPresetTemplate(ticketId, eqIdx, tplId) {
            if (!tplId) return;
            saveModalValuesWithoutClosing(ticketId);
            const t = state.tickets.find(x => x.id === ticketId);
            const eq = t.equipmentList[eqIdx];
            const tpl = knowledgeTemplates.find(k => k.id === tplId);
            if (tpl) {
                eq.analysis = tpl.analysis;
                eq.cause = tpl.cause;
                eq.correctiveAction = tpl.correctiveAction;
                eq.standardsReference = tpl.sourceRef;
            }
            persistState();
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function saveCustomTechTemplate(ticketId, eqIdx) {
            saveModalValuesWithoutClosing(ticketId);
            const t = state.tickets.find(x => x.id === ticketId);
            const eq = t.equipmentList[eqIdx];
            let title = prompt("ตั้งชื่อต้นแบบการวิเคราะห์ของช่างเพื่อใช้ซ้ำในงานถัดไป:", `${eq.type} (${eq.brand}) - ${eq.symptom}`);
            if (!title) return;
            knowledgeTemplates.unshift({
                id: "TPL-" + Date.now(),
                title: title,
                category: eq.type,
                sourceRef: eq.standardsReference || "บันทึกโดยช่างเทคนิค สหคิมมอเตอร์",
                analysis: eq.analysis || "-",
                cause: eq.cause || "-",
                correctiveAction: eq.correctiveAction || "-"
            });
            persistState();
            alert("บันทึกเข้าคลังความรู้ช่างเรียบร้อย!");
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function openInternalActionModal(id) {
            const t = state.tickets.find(x => x.id === id);
            if (!t) return;

                alert('⚠️ ใบงานนี้ถูกล็อกแล้ว! ต้องให้ Supervisor ปลดล็อกก่อนจึงจะแก้ไขได้');
                return;
            }

            let eqHtml = t.equipmentList.map((eq, idx) => {
                if (!eq.checklistResults) eq.checklistResults = getChecklistForType(eq.type).map(item => ({ item, beforeStatus: 'NG', afterStatus: 'OK' }));
                return `

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-white p-2.5 rounded border">

                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-white p-2.5 rounded border">
                            <div>
                                <label class="font-bold mb-1 block text-orange-600"><i class="fa-solid fa-camera mr-1"></i> ถ่าย/อัปโหลด รูป Before:</label>

                            </div>
                            <div>
                                <label class="font-bold mb-1 block text-orange-600"><i class="fa-solid fa-camera mr-1"></i> ถ่าย/อัปโหลด รูป After:</label>

                                <input type="text" id="after-img-${idx}" value="${eq.afterPhotos[0] || ''}" placeholder="หรือวาง URL รูป After..." class="border rounded p-1 w-full text-[10px]">
                            </div>
                        </div>

                        <div class="bg-white p-2.5 rounded border space-y-2">

                                <button type="button" onclick="addChecklistRow('${t.id}', ${idx})" class="bg-slate-900 text-white px-2 py-1 rounded text-[10px] font-bold cursor-pointer"><i class="fa-solid fa-plus mr-1"></i> เพิ่มหัวข้อตรวจเช็ค</button>
                            </div>
                            <div class="space-y-1.5">
                                ${eq.checklistResults.map((chk, cIdx) => `
                                    <div class="flex justify-between items-center bg-slate-50 p-1.5 rounded border gap-2">
                                        <input type="text" id="chk-item-${idx}-${cIdx}" value="${chk.item}" class="border rounded px-1 w-1/2 text-xs">
                                        <div class="flex space-x-1 items-center">
                                            <span>Before:</span><select id="before-status-${idx}-${cIdx}" class="border rounded px-1 font-bold text-xs"><option ${chk.beforeStatus === 'NG' ? 'selected' : ''}>NG</option><option ${chk.beforeStatus === 'OK' ? 'selected' : ''}>OK</option><option ${chk.beforeStatus === 'N/A' ? 'selected' : ''}>N/A</option></select>
                                            <span>After:</span><select id="after-status-${idx}-${cIdx}" class="border rounded px-1 font-bold text-xs"><option ${chk.afterStatus === 'OK' ? 'selected' : ''}>OK</option><option ${chk.afterStatus === 'NG' ? 'selected' : ''}>NG</option><option ${chk.afterStatus === 'N/A' ? 'selected' : ''}>N/A</option></select>
                                            <button type="button" onclick="removeChecklistRow('${t.id}', ${idx}, ${cIdx})" class="text-red-500 font-bold px-1 cursor-pointer">&times;</button>
                                        </div>
                                    </div>
                                `).join('')}

                        </div>

                        <div class="bg-white p-2.5 rounded border space-y-2">
                            <div class="flex flex-wrap justify-between items-center gap-2 border-b pb-1.5">
                                <span class="font-bold text-slate-900"><i class="fa-solid fa-microchip text-orange-500 mr-1"></i> ผลการวิเคราะห์ปัญหา (AI Pump Handbook / EASA + ช่างแก้ไขเพิ่มเองได้)</span>

                                    ${knowledgeTemplates.map(k => `<option value="${k.id}">[${k.category}] ${k.title}</option>`).join('')}

                            </div>
                            <div><label class="font-bold mb-1 block">ผลการวิเคราะห์ (แก้ไข/พิมพ์เพิ่มได้):</label><textarea id="analysis-${idx}" rows="2" class="w-full border rounded p-1.5">${eq.analysis || ''}</textarea></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

                                <div><label class="font-bold mb-1 block">มาตรฐานอ้างอิง:</label><input type="text" id="stdref-${idx}" value="${eq.standardsReference || ''}" placeholder="เช่น Pump Handbook / EASA AR100" class="w-full border rounded p-1.5"></div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div><label class="font-bold mb-1 block">เงื่อนไขการประกัน/คิดเงิน:</label><select id="fault-origin-${idx}" class="border rounded p-1.5 font-bold text-orange-600 bg-orange-50 w-full"><option ${eq.faultOrigin?.includes('ใช้งาน') ? 'selected' : ''}>เกิดจากการใช้งาน / หมดรับประกัน (คิดค่าบริการ)</option><option ${eq.faultOrigin?.includes('ผลิตภัณฑ์') ? 'selected' : ''}>เกิดจากผลิตภัณฑ์ / อยู่ในประกัน (ฟรี / FOC)</option></select></div>

                        </div>

                            <span class="font-bold text-amber-900">รายการอะไหล่</span>

                                <button type="button" onclick="addPartItem('${t.id}', ${idx})" class="bg-amber-600 text-white px-3 py-1 rounded font-bold cursor-pointer">เพิ่มอะไหล่</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let modalBg = document.createElement('div');
            modalBg.id = 'action-modal';
            modalBg.className = 'fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 overflow-y-auto';
            modalBg.innerHTML = `
                <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-center border-b pb-2"><h3 class="font-bold text-base">ปฏิบัติงาน: ${t.id}</h3><button onclick="document.getElementById('action-modal').remove()" class="text-xl font-bold cursor-pointer">&times;</button></div>
                    <div class="bg-orange-50 p-3 rounded-xl border border-orange-200 space-y-2 text-xs">
                        <label class="font-bold text-orange-900 block"><i class="fa-solid fa-user-pen mr-1"></i> ชื่อผู้รับหน้างานจริง / โลเคชั่น:</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <input type="text" id="modal-site-contact" value="${t.siteContact || t.contact}" class="border rounded p-1.5 bg-white font-bold">
                            <input type="text" id="modal-location" value="${t.location || ''}" class="border rounded p-1.5 bg-white font-bold">
                        </div>
                    </div>
                    <div class="space-y-3">${eqHtml}</div>
                    <div class="flex justify-end space-x-2 pt-2 border-t text-xs">
                        <button onclick="document.getElementById('action-modal').remove()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold cursor-pointer">ปิด</button>
                        <button onclick="saveModalChanges('${t.id}')" class="bg-orange-500 text-white px-5 py-2 rounded-xl font-bold shadow cursor-pointer">บันทึกข้อมูล</button>
                        <button onclick="submitForApproval('${t.id}')" class="bg-purple-600 text-white px-5 py-2 rounded-xl font-bold shadow cursor-pointer">ส่ง Supervisor อนุมัติรายงาน</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalBg);
        }

        function addChecklistRow(ticketId, eqIdx) {
            const t = state.tickets.find(x => x.id === ticketId);
            saveModalValuesWithoutClosing(ticketId);
            t.equipmentList[eqIdx].checklistResults.push({ item: "หัวข้อตรวจสอบเพิ่มเติม", beforeStatus: "NG", afterStatus: "OK" });
            persistState();
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function removeChecklistRow(ticketId, eqIdx, chkIdx) {
            const t = state.tickets.find(x => x.id === ticketId);
            saveModalValuesWithoutClosing(ticketId);
            t.equipmentList[eqIdx].checklistResults.splice(chkIdx, 1);
            persistState();
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function addPartItem(ticketId, eqIdx) {
            const t = state.tickets.find(x => x.id === ticketId);
            saveModalValuesWithoutClosing(ticketId);
            const name = document.getElementById(`part-name-${eqIdx}`).value;
            const qty = parseFloat(document.getElementById(`part-qty-${eqIdx}`).value) || 1;
            const price = parseFloat(document.getElementById(`part-price-${eqIdx}`).value) || 0;
            if (!name) { alert('กรุณากรอกชื่ออะไหล่'); return; }
            if (!t.equipmentList[eqIdx].parts) t.equipmentList[eqIdx].parts = [];
            t.equipmentList[eqIdx].parts.push({ name, qty, unit: 'PCS', price, total: qty * price });
            t.status = "PENDING_PARTS_APPROVAL";
            persistState();
            document.getElementById('action-modal').remove();
            openInternalActionModal(ticketId);
        }

        function submitForApproval(ticketId) {
            saveModalValuesWithoutClosing(ticketId);
            const t = state.tickets.find(x => x.id === ticketId);
            t.status = "PENDING_SUPERVISOR_APPROVAL";
            persistState();
            alert('ส่งรายงานให้ Supervisor อนุมัติเรียบร้อย!');
            document.getElementById('action-modal').remove();
            render();
        }

        function saveModalValuesWithoutClosing(ticketId) {
            const t = state.tickets.find(x => x.id === ticketId);
            let siteContactInput = document.getElementById('modal-site-contact');
            let locationInput = document.getElementById('modal-location');
            if (siteContactInput) t.siteContact = siteContactInput.value;
            if (locationInput) t.location = locationInput.value;

            t.equipmentList.forEach((eq, idx) => {
                let sym = document.getElementById(`symptom-${idx}`);
                let det = document.getElementById(`detail-${idx}`);
                let an = document.getElementById(`analysis-${idx}`);
                let cs = document.getElementById(`cause-${idx}`);
                let sr = document.getElementById(`stdref-${idx}`);
                let fo = document.getElementById(`fault-origin-${idx}`);
                let ac = document.getElementById(`action-${idx}`);
                let bFile = document.getElementById(`before-file-${idx}`);
                let aFile = document.getElementById(`after-file-${idx}`);
                let bImg = document.getElementById(`before-img-${idx}`);
                let aImg = document.getElementById(`after-img-${idx}`);

                if (sym) eq.symptom = sym.value;
                if (det) eq.detail = det.value;
                if (an) eq.analysis = an.value;
                if (cs) eq.cause = cs.value;
                if (sr) eq.standardsReference = sr.value;
                if (fo) eq.faultOrigin = fo.value;
                if (ac) eq.correctiveAction = ac.value;

                if (bFile && bFile.files && bFile.files[0]) {
                    eq.beforePhotos = [URL.createObjectURL(bFile.files[0])];
                } else if (bImg && bImg.value) {
                    eq.beforePhotos = [bImg.value];
                }
                if (aFile && aFile.files && aFile.files[0]) {
                    eq.afterPhotos = [URL.createObjectURL(aFile.files[0])];
                } else if (aImg && aImg.value) {
                    eq.afterPhotos = [aImg.value];
                }

                if (eq.checklistResults) {
                    eq.checklistResults.forEach((chk, cIdx) => {
                        let itemInput = document.getElementById(`chk-item-${idx}-${cIdx}`);
                        let bSel = document.getElementById(`before-status-${idx}-${cIdx}`);
                        let aSel = document.getElementById(`after-status-${idx}-${cIdx}`);
                        if (itemInput) chk.item = itemInput.value;
                        if (bSel) chk.beforeStatus = bSel.value;
                        if (aSel) chk.afterStatus = aSel.value;
                    });
                }
            });
        }

        function saveModalChanges(ticketId) {
            saveModalValuesWithoutClosing(ticketId);
            persistState();
            alert('บันทึกข้อมูลเรียบร้อย!');
            document.getElementById('action-modal').remove();
            render();
        }

        function openServiceReport(id) {
            state.activeReportId = id;
            state.currentView = 'report_view';
            render();
        }

        function renderReportView(id) {
            const t = state.tickets.find(x => x.id === id) || state.tickets[0];
            if (!t) return '';
            return `
                <div class="max-w-3xl mx-auto bg-white p-6 sm:p-8 rounded-xl shadow border space-y-4 text-xs sm:text-sm print-container">
                    <div class="flex justify-between items-center border-b-4 border-orange-500 pb-3">
                        <div>
                            <h1 class="text-base sm:text-lg font-extrabold text-slate-900">บริษัท สหคิมมอเตอร์ จำกัด</h1>
                            <p class="text-[11px] text-orange-600 font-bold">SAHA KIM MOTOR CO., LTD.</p>
                            <p class="text-[10px] text-slate-500">บริการซ่อม บำรุงรักษา และจำหน่ายปั๊มน้ำ มอเตอร์ Blower อุตสาหกรรม</p>
                        </div>
                        <div class="text-right bg-slate-50 p-2.5 rounded-lg border">
                            <h2 class="text-xs sm:text-sm font-extrabold text-orange-600">SERVICE REPORT</h2>
                            <p class="text-[11px] font-bold">เลขที่ใบงาน: ${t.id}</p>
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg space-y-1 text-xs">
                        <p class="font-bold text-blue-900 text-sm border-b border-blue-200 pb-1">ส่วนที่ 1: ข้อมูลลูกค้าผู้แจ้งซ่อม (Customer Information)</p>
                        <p><b>บริษัท:</b> ${t.company} (TAX ID: ${t.taxId || '-'}) | <b>เลขที่เอกสาร/ประกัน:</b> ${t.docNo || '-'}</p>
                        <p><b>ผู้ติดต่อตอนแจ้ง:</b> ${t.contact}</p>
                        <p><b>ประเภทบริการ:</b> ${t.serviceType} | <b>เงื่อนไข:</b> <span class="text-indigo-600 font-bold">${t.warranty}</span> | <b>ความเร่งด่วน:</b> <span class="text-red-600 font-bold">${t.urgency}</span></p>
                        <p><b>สถานที่ปฏิบัติงาน:</b> ${t.location || '-'}</p>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg space-y-1 text-xs">
                        <p class="font-bold text-slate-900 text-sm border-b border-slate-200 pb-1">ส่วนที่ 2: ข้อมูลการดำเนินงานโดยทีมงานบริษัท (Company Operations)</p>
                        <p><b>ช่างผู้ปฏิบัติงาน:</b> <span class="font-bold text-slate-800">${t.assignedTech || 'ยังไม่ระบุ'}</span></p>
                        <p><b>ผู้รับหน้างานจริง:</b> <span class="font-bold text-indigo-600">${t.siteContact || t.contact}</span></p>
                        <p><b>วันที่นัดหมาย:</b> <span class="text-emerald-600 font-bold">${t.confirmedDate || t.desiredDate}</span></p>
                        <p><b>สถานะใบงาน:</b> <span class="font-bold text-orange-600">${t.status}</span></p>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-bold text-xs sm:text-sm border-b pb-1">ส่วนที่ 3: รายการอุปกรณ์และการตรวจเช็คมาตรฐาน</h3>
                        ${t.equipmentList.map((eq, idx) => `
                            <div class="border rounded-lg p-3 space-y-2 bg-slate-50 text-xs">
                                <p class="font-bold text-orange-600">อุปกรณ์ #${idx + 1}: ${eq.type} (${eq.brand} - ${eq.model}) [Tag: ${eq.tag || 'N/A'}]</p>
                                <p><b>อาการเสีย:</b> ${eq.symptom} (${eq.detail || '-'})</p>
                                <div class="bg-white p-2.5 rounded border space-y-1">
                                    <p class="font-bold text-indigo-700">ผลการวิเคราะห์ปัญหา:</p>
                                    <p><b>วิเคราะห์:</b> ${eq.analysis || '-'}</p>
                                    <p><b>สาเหตุ:</b> ${eq.cause || '-'}</p>
                                    <p><b>มาตรฐานอ้างอิง:</b> ${eq.standardsReference || '-'}</p>
                                    <p><b>เงื่อนไข:</b> <span class="font-bold text-orange-600">${eq.faultOrigin || '-'}</span></p>
                                    <p><b>แนวทางแก้ไข:</b> ${eq.correctiveAction || '-'}</p>
                                </div>
                                ${eq.checklistResults ? `
                                    <div>
                                        <p class="font-bold mb-1">ผลการตรวจเช็คมาตรฐาน (Checklist):</p>
                                        <table class="w-full border-collapse bg-white rounded border text-[11px]">
                                            <tr class="bg-slate-100 border-b"><th class="p-1 text-left">หัวข้อ</th><th class="p-1 text-center w-16">Before</th><th class="p-1 text-center w-16">After</th></tr>
                                            ${eq.checklistResults.map(chk => `<tr class="border-b"><td class="p-1">${chk.item}</td><td class="p-1 text-center font-bold ${chk.beforeStatus==='NG'?'text-red-600':'text-emerald-600'}">${chk.beforeStatus}</td><td class="p-1 text-center font-bold ${chk.afterStatus==='OK'?'text-emerald-600':'text-red-600'}">${chk.afterStatus}</td></tr>`).join('')}
                                        </table>
                                    </div>
                                ` : ''}
                                ${eq.parts && eq.parts.length > 0 ? `
                                    <div>
                                        <p class="font-bold mb-1">อะไหล่ที่เบิกใช้:</p>
                                        <table class="w-full border-collapse bg-white rounded border text-[11px]">
                                            <tr class="bg-slate-100 border-b"><th class="p-1 text-left">รายการ</th><th class="p-1 text-center w-16">จน.</th><th class="p-1 text-right w-20">รวม</th></tr>
                                            ${eq.parts.map(p => `<tr class="border-b"><td class="p-1">${p.name}</td><td class="p-1 text-center">${p.qty} ${p.unit}</td><td class="p-1 text-right font-bold">${p.total}</td></tr>`).join('')}
                                        </table>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-2 gap-6 pt-6 border-t text-center text-xs">
                        <div><p>___________________________</p><p class="mt-1 font-bold">(${t.assignedTech || 'ช่างผู้ปฏิบัติงาน'})</p><p class="text-slate-500">Technician</p></div>
                        <div><p>___________________________</p><p class="mt-1 font-bold">(${t.siteContact || t.contact})</p><p class="text-slate-500">Customer Site Acceptance</p></div>
                    </div>

                    <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg text-center font-bold text-emerald-800 text-xs">
                        Supervisor Approved & Signed: ${t.approvedBySupervisor || 'รออนุมัติ'}
                    </div>

                    <div class="text-center pt-2 no-print">
                        <button onclick="window.print()" class="bg-orange-500 text-white font-bold px-6 py-2 rounded-xl text-xs shadow cursor-pointer"><i class="fa-solid fa-print mr-1"></i> พิมพ์รายงาน (A4 / Save PDF)</button>
                    </div>
                </div>
            `;
        }

        render();
        if (gasWebAppUrl) loadFromGoogleSheet(false);
    </script>
</body>
</html>
